# Na VM de staging. O assistente e o banco dele ficam isolados do KoreOS; o engine do
# WhatsApp é a Evolution GO que já roda lá (uma instância nova, só para o seu número).
#
# A rede `evolution` é a do engine existente: confira o nome com
#   docker network ls
# e ajuste EVOLUTION_NETWORK no .env (ex.: koreos-infra_default).
services:
  assistente:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://assistente:${POSTGRES_PASSWORD}@db:5432/assistente
    depends_on:
      db:
        condition: service_healthy
    networks: [interna, evolution]
    # Só no localhost da VM: o engine chama pela rede interna, e o painel (se ligado)
    # é acessado por túnel SSH ou pelo proxy da VM com HTTPS.
    ports:
      - "127.0.0.1:3100:3100"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistente
      POSTGRES_DB: assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente"]
      interval: 5s
      retries: 10
    networks: [interna]

  # Dump do banco toda madrugada (03:30 no fuso do dono) e um na subida, guardados em
  # ./backups por 14 dias. Fichas, perfil e lições não estão em lugar nenhum além daqui.
  # Restaurar: gunzip -c backups/<arquivo>.sql.gz | docker compose exec -T db psql -U assistente assistente
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${FUSO:-America/Sao_Paulo}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /usr/local/bin/dump <<'FIM'
        #!/bin/sh
        set -e
        arq=/backups/assistente-$$(date +%Y-%m-%d_%H%M).sql.gz
        pg_dump -h db -U assistente assistente | gzip > "$$arq.tmp" && mv "$$arq.tmp" "$$arq"
        find /backups -name 'assistente-*.sql.gz' -mtime +14 -delete
        echo "backup ok: $$arq"
        FIM
        chmod +x /usr/local/bin/dump
        dump
        echo '30 3 * * * /usr/local/bin/dump' | crontab -
        exec crond -f -l 8
    networks: [interna]

volumes:
  dados:

networks:
  interna:
  evolution:
    external: true
    name: ${EVOLUTION_NETWORK}
